<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5ede3 0%, #ede1d5 100%);
            color: #5a5450;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100vw;
            height: 100vh;
            background: #faf8f5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .inner {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 28px;
            font-family: 'Georgia', serif;
            font-size: 32px;
            line-height: 1.2;
            color: #8b7355;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .section {
            margin-bottom: 22px;
        }
        
        .section-title {
            font-size: 10px;
            font-weight: 700;
            color: #a89a8a;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 10px;
        }
        
        label {
            display: block;
            font-size: 14px;
            color: #6b6360;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input[type="time"],
        select {
            width: 100%;
            padding: 10px 12px;
            font-size: 16px;
            border: 1px solid #e0d5cb;
            border-radius: 4px;
            background: #fefdfb;
            color: #5a5450;
            transition: all 0.2s;
            font-family: 'Monaco', 'Courier New', monospace;
        }
        
        input[type="time"]:focus,
        select:focus {
            outline: none;
            border-color: #b8a08f;
            background: #fffbf7;
            box-shadow: 0 0 0 3px rgba(184, 160, 143, 0.08);
        }
        
        .toggle-group {
            display: flex;
            gap: 0;
            margin-top: 10px;
        }
        
        .toggle-btn {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #e0d5cb;
            border-radius: 4px;
            background: #fefdfb;
            color: #6b6360;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .toggle-btn:first-child {
            margin-right: 8px;
        }
        
        .toggle-btn.active {
            background: #8b7355;
            color: #faf8f5;
            border-color: #8b7355;
        }
        
        .toggle-btn:hover:not(.active) {
            background: #f5f1ed;
            border-color: #d4c9be;
        }
        
        .hidden {
            display: none;
        }
        
        .result-card {
            background: #fefdfb;
            border: 1px solid #e0d5cb;
            border-radius: 4px;
            padding: 14px;
            margin-bottom: 12px;
        }
        
        .result-card.primary {
            background: #f5ede3;
            border-color: #d4c9be;
        }
        
        .result-label {
            font-size: 10px;
            color: #a89a8a;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 6px;
            font-weight: 700;
        }
        
        .result-value {
            font-size: 32px;
            font-weight: 300;
            color: #8b7355;
            font-family: 'Monaco', 'Courier New', monospace;
            letter-spacing: 2px;
        }
        
        .result-card.primary .result-value {
            color: #8b7355;
        }
        
        .overtime-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        
        .overtime-item {
            background: #fefdfb;
            border: 1px solid #e0d5cb;
            border-radius: 4px;
            padding: 10px;
            text-align: center;
        }
        
        .overtime-label {
            font-size: 10px;
            color: #a89a8a;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .overtime-time {
            font-size: 18px;
            font-weight: 500;
            color: #8b7355;
            font-family: 'Monaco', 'Courier New', monospace;
            letter-spacing: 1px;
        }
        
        .info-box {
            background: #fef4e6;
            border: 1px solid #e6d4c3;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 12px;
            color: #8b7355;
            margin-top: 8px;
            line-height: 1.5;
        }
        
        .info-box.warning {
            background: #fef4e6;
            border-color: #e6d4c3;
            color: #8b7355;
        }
        
        .info-box.success {
            background: #e8f3e8;
            border-color: #d4e0d4;
            color: #5a6b5a;
        }
        
        button {
            width: 100%;
            padding: 11px;
            background: #8b7355;
            color: #faf8f5;
            border: 1px solid #8b7355;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        
        button:hover {
            background: #6b5445;
            border-color: #6b5445;
        }
        
        button:active {
            opacity: 0.95;
        }
        
        .reset-btn {
            background: #e0d5cb;
            color: #6b6360;
            border-color: #e0d5cb;
            margin-top: 8px;
        }
        
        .reset-btn:hover {
            background: #d4c9be;
            border-color: #d4c9be;
        }
        
        .details-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px solid #ede8e1;
        }
        
        .details-row:last-child {
            border-bottom: none;
        }
        
        .details-label {
            color: #8b7c70;
        }
        
        .details-value {
            font-weight: 600;
            color: #5a5450;
            font-family: 'Monaco', 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="inner">
            <div class="header">Work Timer</div>
            
            <div class="section">
                <div class="section-title">Orario di entrata</div>
                <label for="entryTime">A che ora sei entrato?</label>
                <input type="time" id="entryTime" value="08:30">
            </div>
            
            <div class="section">
                <div class="section-title">Pausa pranzo</div>
                <label>Sei uscito per la pausa pranzo?</label>
                <div class="toggle-group">
                    <button type="button" class="toggle-btn active" data-pause="no">No</button>
                    <button type="button" class="toggle-btn" data-pause="yes">Sì</button>
                </div>
            </div>
            
            <div id="pauseDetailsSection" class="section hidden">
                <div class="section-title">Dettagli pausa</div>
                <label for="pauseStart">Uscita per pausa</label>
                <input type="time" id="pauseStart" value="12:30">
                
                <label for="pauseEnd" style="margin-top: 12px;">Rientro in ufficio</label>
                <input type="time" id="pauseEnd" value="13:00">
            </div>
            
            <div id="resultsSection" class="section hidden">
                <div class="section-title">Risultati</div>
                
                <div id="pauseInfoBox"></div>
                
                <div class="result-card primary">
                    <div class="result-label">Uscita senza straordinario</div>
                    <div class="result-value" id="normalExit">-</div>
                </div>
                
                <div class="result-card">
                    <div class="result-label">Dettagli della giornata</div>
                    <div style="font-size: 13px; color: #6b6360; line-height: 1.8;">
                        <div class="details-row">
                            <span class="details-label">Ore di lavoro netto:</span>
                            <span class="details-value">8:48</span>
                        </div>
                        <div class="details-row">
                            <span class="details-label">Pausa pranzo:</span>
                            <span class="details-value" id="pauseDuration">1:00</span>
                        </div>
                        <div class="details-row">
                            <span class="details-label">Tempo in ufficio:</span>
                            <span class="details-value" id="officeTime">9:48</span>
                        </div>
                    </div>
                </div>
                
                <div class="result-card">
                    <div class="result-label">Straordinario (ogni 30 minuti)</div>
                    <div class="overtime-grid" id="overtimeGrid"></div>
                </div>
            </div>
        </div>
        
        <button id="calculateBtn" onclick="calculate()">Calcola orario di uscita</button>
        <button class="reset-btn" onclick="reset()">Ripristina</button>
    </div>

    <script>
        const pauseToggleButtons = document.querySelectorAll('[data-pause]');
        const pauseDetailsSection = document.getElementById('pauseDetailsSection');
        const resultsSection = document.getElementById('resultsSection');
        
        let pauseMode = 'no';
        
        pauseToggleButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                pauseToggleButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                pauseMode = this.dataset.pause;
                
                if (pauseMode === 'yes') {
                    pauseDetailsSection.classList.remove('hidden');
                } else {
                    pauseDetailsSection.classList.add('hidden');
                }
            });
        });
        
        function timeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }
        
        function minutesToTime(minutes) {
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
        }
        
        function calculate() {
            const entryStr = document.getElementById('entryTime').value;
            
            if (!entryStr) {
                alert('Per favore, inserisci l\'orario di entrata');
                return;
            }
            
            const entryMinutes = timeToMinutes(entryStr);
            const baseWorkMinutes = 8 * 60 + 48;
            let pauseMinutes = 60;
            let pauseInfoMsg = '';
            let extraMinutes = 0;
            
            if (pauseMode === 'yes') {
                const pauseStartStr = document.getElementById('pauseStart').value;
                const pauseEndStr = document.getElementById('pauseEnd').value;
                
                if (!pauseStartStr || !pauseEndStr) {
                    alert('Per favore, inserisci gli orari di pausa');
                    return;
                }
                
                const pauseStartMinutes = timeToMinutes(pauseStartStr);
                const pauseEndMinutes = timeToMinutes(pauseEndStr);
                
                pauseMinutes = pauseEndMinutes - pauseStartMinutes;
                
                if (pauseMinutes < 0) {
                    pauseMinutes += 24 * 60;
                }
                
                if (pauseMinutes < 60) {
                    pauseInfoMsg = `<div class="info-box warning">⚠️ Pausa inferiore a 1 ora. Verrà calcolata come 1 ora standard.</div>`;
                    pauseMinutes = 60;
                } else if (pauseMinutes > 60) {
                    extraMinutes = pauseMinutes - 60;
                    pauseInfoMsg = `<div class="info-box success">✓ Pausa superiore a 1 ora. Hai ${minutesToTime(extraMinutes)} di straordinario da recuperare.</div>`;
                }
            }
            
            let exitMinutesWithoutOvertime = entryMinutes + baseWorkMinutes + extraMinutes;
            
            let normalExitMinutes = exitMinutesWithoutOvertime;
            if (normalExitMinutes >= 24 * 60) {
                normalExitMinutes -= 24 * 60;
            }
            
            document.getElementById('normalExit').textContent = minutesToTime(normalExitMinutes);
            document.getElementById('pauseDuration').textContent = minutesToTime(pauseMinutes);
            
            const totalOfficeMinutes = baseWorkMinutes + pauseMinutes;
            document.getElementById('officeTime').textContent = minutesToTime(totalOfficeMinutes);
            
            document.getElementById('pauseInfoBox').innerHTML = pauseInfoMsg;
            
            const overtimeGrid = document.getElementById('overtimeGrid');
            overtimeGrid.innerHTML = '';
            
            for (let i = 1; i <= 4; i++) {
                const overtimeMinutes = exitMinutesWithoutOvertime + (i * 30);
                let displayMinutes = overtimeMinutes;
                if (displayMinutes >= 24 * 60) {
                    displayMinutes -= 24 * 60;
                }
                
                const item = document.createElement('div');
                item.className = 'overtime-item';
                item.innerHTML = `
                    <div class="overtime-label">+${i * 30} min</div>
                    <div class="overtime-time">${minutesToTime(displayMinutes)}</div>
                `;
                overtimeGrid.appendChild(item);
            }
            
            resultsSection.classList.remove('hidden');
        }
        
        function reset() {
            document.getElementById('entryTime').value = '08:30';
            document.getElementById('pauseStart').value = '12:30';
            document.getElementById('pauseEnd').value = '13:00';
            pauseToggleButtons.forEach(b => b.classList.remove('active'));
            pauseToggleButtons[0].classList.add('active');
            pauseMode = 'no';
            pauseDetailsSection.classList.add('hidden');
            resultsSection.classList.add('hidden');
        }
        
        document.getElementById('entryTime').addEventListener('change', calculate);
        document.getElementById('pauseStart').addEventListener('change', calculate);
        document.getElementById('pauseEnd').addEventListener('change', calculate);
    </script>
</body>
</html>
