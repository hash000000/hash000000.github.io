<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Da Uomo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Georgia', serif;
  }
  .cover {
    width: 340px;
    height: 520px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative;
    border: 1px solid #333;
    box-shadow: 6px 6px 0 #000, 12px 12px 0 #222;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .cover:active {
    transform: translate(6px, 6px);
    box-shadow: none;
  }
  .band-top {
    background: #E75420;
    flex: 0 0 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    border-bottom: 3px solid #000;
    border-top: 3px solid #000;
  }
  .series-line {
    width: 100%;
    border-top: 1.5px solid #000;
    border-bottom: 1.5px solid #000;
    padding: 4px 0;
    text-align: center;
  }
  .series-text {
    font-family: 'Georgia', serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: #000;
    font-style: italic;
  }
  .band-top-title {
    font-family: 'Georgia', serif;
    font-size: 10px;
    letter-spacing: 4px;
    color: #000;
    margin-top: 10px;
    font-weight: bold;
  }
  .oval-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
  }
  .oval {
    width: 42px;
    height: 50px;
    border: 2px solid #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
  .penguin-svg {
    width: 26px;
    height: 32px;
  }
  .band-middle {
    background: #f5f0e8;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 28px;
    border-top: 3px solid #000;
    border-bottom: 3px solid #000;
  }
  .middle-rule {
    width: 80%;
    border: none;
    border-top: 1.5px solid #000;
    margin: 14px auto;
    display: block;
  }
  .book-author {
    font-family: 'Georgia', serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: #111;
    text-align: center;
    font-style: italic;
  }
  .book-title {
    font-family: 'Georgia', serif;
    font-size: 18px;
    font-weight: bold;
    color: #111;
    text-align: center;
    line-height: 1.45;
    letter-spacing: 0.3px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .band-bottom {
    background: #E75420;
    flex: 0 0 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 20px;
    border-top: 3px solid #000;
    border-bottom: 3px solid #000;
  }
  .bottom-label {
    font-family: 'Georgia', serif;
    font-size: 9px;
    letter-spacing: 3px;
    color: #000;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .hint {
    position: absolute;
    bottom: -28px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 11px;
    color: #555;
    letter-spacing: 1px;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="cover" onclick="newEntry()" title="Clicca per un altro">
  <div class="band-top">
    <div class="series-line">
      <span class="series-text">Da Uomo</span>
    </div>
    <div class="oval-wrapper">
      <div class="oval">
        <svg class="penguin-svg" viewBox="0 0 26 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="13" cy="19" rx="9" ry="13" fill="#000"/>
          <ellipse cx="13" cy="18" rx="5.5" ry="8.5" fill="#fff"/>
          <ellipse cx="10" cy="9" rx="3.5" ry="4" fill="#000"/>
          <ellipse cx="16" cy="9" rx="3.5" ry="4" fill="#000"/>
          <ellipse cx="10.5" cy="8.5" rx="1.5" ry="1.8" fill="#fff"/>
          <ellipse cx="15.5" cy="8.5" rx="1.5" ry="1.8" fill="#fff"/>
          <ellipse cx="11" cy="8.8" rx="0.7" ry="0.8" fill="#000"/>
          <ellipse cx="16" cy="8.8" rx="0.7" ry="0.8" fill="#000"/>
          <polygon points="13,11 11.5,13 14.5,13" fill="#E75420"/>
          <ellipse cx="7" cy="24" rx="4" ry="2.5" fill="#000" transform="rotate(-20 7 24)"/>
          <ellipse cx="19" cy="24" rx="4" ry="2.5" fill="#000" transform="rotate(20 19 24)"/>
          <ellipse cx="9" cy="31" rx="3" ry="1.2" fill="#E75420"/>
          <ellipse cx="17" cy="31" rx="3" ry="1.2" fill="#E75420"/>
        </svg>
      </div>
    </div>
    <div class="band-top-title">PENGUIN BOOKS</div>
  </div>

  <div class="band-middle">
    <p class="book-author">Ci sono tutta una serie di micro-cose che uno deve sempre stare attento a evitare di fare, sennò è frocio</p>
    <span class="middle-rule"></span>
    <p class="book-title" id="title">…</p>
    <span class="middle-rule"></span>
  </div>

  <div class="band-bottom">
    <div class="oval">
      <svg class="penguin-svg" viewBox="0 0 26 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="13" cy="19" rx="9" ry="13" fill="#000"/>
        <ellipse cx="13" cy="18" rx="5.5" ry="8.5" fill="#fff"/>
        <ellipse cx="10" cy="9" rx="3.5" ry="4" fill="#000"/>
        <ellipse cx="16" cy="9" rx="3.5" ry="4" fill="#000"/>
        <ellipse cx="10.5" cy="8.5" rx="1.5" ry="1.8" fill="#fff"/>
        <ellipse cx="15.5" cy="8.5" rx="1.5" ry="1.8" fill="#fff"/>
        <ellipse cx="11" cy="8.8" rx="0.7" ry="0.8" fill="#000"/>
        <ellipse cx="16" cy="8.8" rx="0.7" ry="0.8" fill="#000"/>
        <polygon points="13,11 11.5,13 14.5,13" fill="#E75420"/>
        <ellipse cx="7" cy="24" rx="4" ry="2.5" fill="#000" transform="rotate(-20 7 24)"/>
        <ellipse cx="19" cy="24" rx="4" ry="2.5" fill="#000" transform="rotate(20 19 24)"/>
        <ellipse cx="9" cy="31" rx="3" ry="1.2" fill="#E75420"/>
        <ellipse cx="17" cy="31" rx="3" ry="1.2" fill="#E75420"/>
      </svg>
    </div>
    <span class="bottom-label">Penguin Books</span>
  </div>

  <p class="hint">clicca per un altro</p>
</div>

<script>
const voci = [

  "Consolare qualcuno",

  "Portarsi il phon al calcetto",
  "Il trekking",
  "Scarpe nuove",
  "Parlare in inglese",
  "Indossare vestiti chiari",

  "Le persone francesi",

  "Dire di sì in generale",

  "Rallentare troppo in prossimità dei dossi",
  "Mettere like su Instagram",
  "Farsi la terza dose",
  "Andare ai musei senza la tua ragazza",
  "Fare delle foto",
  "Creme solari",
  "Avere la media dell'otto al liceo",
  "Impressionarsi",
  "\"Che ce sta un secchio, regà?\"",
  "Andare dallo psicoterapeuta",

let last = -1;
function newEntry() {
  let idx;
  do { idx = Math.floor(Math.random() * voci.length); } while (idx === last && voci.length > 1);
  last = idx;
  document.getElementById('title').textContent = voci[idx];
}
newEntry();
</script>
</body>
</html>
